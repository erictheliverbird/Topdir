<!DOCTYPE html>
                        <html lang="es" class="h-full">
                        <head>
                            <meta charset="UTF-8">
                            <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
                            <meta name="theme-color" content="#000000">
                            <meta name="apple-mobile-web-app-capable" content="yes">
                            <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
                            <link rel="icon" type="image/png" href="icon-192.png">
                            <title>Proyección en Vivo - Pantalla Externa</title>
                            <script src="https://cdn.tailwindcss.com"></script>
                            <script src="background-loop.js"></script>
                            <link href="https://fonts.googleapis.com/css2?family=Amatic+SC:wght@400;700&family=Cinzel:wght@500;700;900&family=EB+Garamond:ital,wght@0,400;0,700;1,400&family=Inter:wght@300;400;500;600;700;800&family=Lora:ital,wght@0,400;0,700;1,400&family=Merriweather:wght@300;400;700&family=Montserrat:wght@400;600;800&family=Open+Sans:wght@300;400;600;700&family=Oswald:wght@400;700&family=Playfair+Display:ital,wght@0,600;0,800;1,400&family=Poppins:wght@300;400;600;700&family=Quicksand:wght@400;600;700&family=Raleway:wght@300;400;600;700&family=Roboto+Slab:wght@400;700&family=Ubuntu:wght@400;700&family=Fira+Sans:wght@400;600;700&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Source+Sans+3:wght@400;600;700&family=Spectral:ital,wght@0,400;0,700;1,400&family=Crimson+Text:ital,wght@0,400;0,700;1,400&family=Cardo:wght@400;700&family=Josefin+Sans:wght@400;600;700&family=Nunito+Sans:wght@400;600;700&family=PT+Serif:ital,wght@0,400;0,700;1,400&family=Archivo+Black&display=swap" rel="stylesheet">
                            <style>
                                :root { color-scheme: dark; }
                                html, body { width: 100%; height: 100%; min-height: 100%; margin: 0; padding: 0; overflow: hidden; background: #000; }
                                body { height: 100vh; height: 100dvh; padding: max(2.5vw, env(safe-area-inset-top)) max(2.5vw, env(safe-area-inset-right)) max(2.5vw, env(safe-area-inset-bottom)) max(2.5vw, env(safe-area-inset-left)) !important; box-sizing: border-box; }
                                #proj-fullscreen-prompt { font-family: Inter, system-ui, sans-serif; }
                                .text-projection-shadow { text-shadow: 0 2px 12px rgba(0,0,0,0.95), 0 4px 24px rgba(0,0,0,0.85); }
                            </style>
                            <link rel="stylesheet" href="responsive.css">
                        </head>
                        <body class="projection-page h-screen w-screen overflow-hidden relative flex flex-col justify-between p-16 select-none bg-black">
                            <button id="proj-fullscreen-prompt" type="button" class="fixed left-1/2 top-4 z-[100] -translate-x-1/2 rounded-xl border border-white/30 bg-black/85 px-5 py-3 text-sm font-bold text-white shadow-2xl" style="display:none">⛶ Activar pantalla completa</button>
                            <div id="proj-backdrop" class="absolute inset-0 z-0 bg-cover bg-center transition-all duration-300"></div>
                            <video id="proj-background-video" class="absolute inset-0 z-[1] w-full h-full object-cover pointer-events-none projection-background-loop-layer" muted playsinline loop autoplay preload="auto" aria-hidden="true"></video>
                            <video id="proj-background-video-next" class="absolute inset-0 z-[1] w-full h-full object-cover pointer-events-none projection-background-loop-layer" muted playsinline loop autoplay preload="auto" aria-hidden="true"></video>
                            <video id="proj-video" class="absolute inset-0 w-full h-full object-contain bg-black z-10 hidden" playsinline autoplay></video>
                            <button id="proj-enable-audio" type="button" class="absolute z-50 hidden left-1/2 top-1/2 -translate-x-1/2 -translate-y-1/2 rounded-xl bg-black/85 border border-white/40 px-6 py-4 text-white text-lg font-bold shadow-2xl" style="pointer-events:auto">▶ Toca para reproducir con sonido</button>

                            <video id="proj-screen-video" class="absolute inset-0 w-full h-full object-contain bg-black z-10 hidden" muted playsinline autoplay></video>
                            <img id="proj-screen-frame-fallback" class="absolute inset-0 w-full h-full object-contain bg-black z-10 hidden" alt="Fotograma de respaldo de la captura" />
                            <div id="proj-youtube" title="Reproductor de YouTube (proyección)" class="absolute inset-0 w-full h-full bg-black z-10 hidden overflow-hidden" aria-label="Reproductor de YouTube" style="contain:layout paint; clip-path:inset(0)"><div id="proj-youtube-player" data-youtube-api="1" class="absolute inset-0 w-full h-full"></div></div>
                            <div id="proj-overlay" class="absolute inset-0 z-20 bg-black/40 transition-all duration-300"></div>
                            <img id="proj-logo-standby" class="absolute left-1/2 top-1/2 -translate-x-1/2 -translate-y-1/2 max-w-[40%] max-h-[60%] object-contain z-30 hidden" alt="Standby Logo" />
                            <img id="proj-logo-corner" class="absolute max-w-[12%] max-h-[15%] object-contain z-30 hidden" alt="Corner Logo" />
                            <div id="proj-karaoke" class="absolute inset-0 z-40 hidden flex items-center justify-center px-[8%] py-[6%] pointer-events-none"><div id="proj-karaoke-bg" class="absolute inset-0 z-0 pointer-events-none"></div><div id="proj-karaoke-stanza" class="relative z-10 w-full whitespace-pre-line leading-relaxed text-center"></div></div>
                            <div id="proj-transition-curtain" class="projection-transition-curtain" aria-hidden="true"></div>
                            <video id="proj-transition-video" class="projection-transition-video" muted playsinline preload="auto" aria-hidden="true"></video>
                            <div id="proj-transition-logo" class="projection-logo-transition" aria-hidden="true"><img id="proj-transition-logo-image" alt="Logo de la iglesia" /></div>
                            <div class="z-30 text-center w-full my-auto px-12">
                                <p id="proj-text" class="text-white leading-relaxed"></p>
                            </div>
                            <div class="z-30 text-center w-full pb-6">
                                <p id="proj-citation" class="text-white/90 tracking-widest font-black uppercase text-2xl"></p>
                            </div>
                            <script>
                                // Receptor autónomo: la proyección sigue escuchando aunque Safari
                                // separe esta pestaña y ya no podamos manipular su document desde la consola.
                                (() => {
                                    const CHANNEL_NAME = 'biblical-projector-channel';
                                    const STORAGE_KEY = 'biblical_projector_data';
                                    const projectorInstanceId = Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 10);
                                    const projectorControllerId = new URLSearchParams(window.location.search).get('controller') || '';
                                    let channel = null;
                                    const PROJECTOR_DB_NAME = 'proyector-biblico-local';
                                    const PROJECTION_MEDIA_RECORD_PREFIX = 'projection-media:';
                                    let projectorMediaDbPromise = null;
                                    const projectorMediaUrls = new Map();
                                    function openProjectorMediaDb() {
                                        if (projectorMediaDbPromise) return projectorMediaDbPromise;
                                        projectorMediaDbPromise = new Promise((resolve, reject) => {
                                            const request = indexedDB.open(PROJECTOR_DB_NAME, 1);
                                            request.onupgradeneeded = () => {
                                                const db = request.result;
                                                if (!db.objectStoreNames.contains('settings')) db.createObjectStore('settings');
                                                if (!db.objectStoreNames.contains('bibles')) db.createObjectStore('bibles', { keyPath: 'id' });
                                            };
                                            request.onsuccess = () => resolve(request.result);
                                            request.onerror = () => reject(request.error || new Error('No se pudo abrir el almacenamiento local.'));
                                        });
                                        return projectorMediaDbPromise;
                                    }
                                    async function getProjectorMediaUrl(assetId) {
                                        if (projectorMediaUrls.has(assetId)) return projectorMediaUrls.get(assetId);
                                        const db = await openProjectorMediaDb();
                                        const record = await new Promise((resolve, reject) => {
                                            const request = db.transaction('settings', 'readonly').objectStore('settings').get(PROJECTION_MEDIA_RECORD_PREFIX + assetId);
                                            request.onsuccess = () => resolve(request.result || null);
                                            request.onerror = () => reject(request.error);
                                        });
                                        const blob = record && record.blob instanceof Blob ? record.blob : null;
                                        if (!blob) throw new Error('No se encontró el archivo multimedia en este dispositivo.');
                                        const url = URL.createObjectURL(blob);
                                        projectorMediaUrls.set(assetId, url);
                                        return url;
                                    }
                                    function sendProjectionAssetStatus(kind, assetId, message) {
                                        try { if (channel) channel.postMessage({ type: '__projection_asset_status', controllerId: projectorControllerId, kind, assetId: assetId || '', message: String(message || ''), timestamp: Date.now() }); } catch (_) {}
                                    }
                                    let projectedBackgroundAssetId = '';
                                    const projectedBackgroundLoop = window.ProjectionBackgroundLoop.create(
                                        document.getElementById('proj-background-video'),
                                        document.getElementById('proj-background-video-next'),
                                        {
                                            getUrl: getProjectorMediaUrl,
                                            onReady: assetId => sendProjectionAssetStatus('background', assetId, 'Fondo de video listo · bucle con fundido'),
                                            onTime: (assetId, currentTime) => {
                                                try { if (channel) channel.postMessage({ type: '__projection_background_time', controllerId: projectorControllerId, assetId, currentTime, timestamp: Date.now() }); } catch (_) {}
                                            },
                                            onError: (message, error) => {
                                                sendProjectionAssetStatus('background', projectedBackgroundAssetId, message);
                                                if (error) console.warn('No se pudo reproducir el video de fondo:', error);
                                            }
                                        }
                                    );
                                    function updateProjectedBackground(data) {
                                        const styles = data.styles || {};
                                        projectedBackgroundAssetId = String(styles.backgroundVideoId || '');
                                        const visible = styles.bgType === 'video' && !!projectedBackgroundAssetId && data.mediaMode === 'none' && !data.isBlackout;
                                        projectedBackgroundLoop.set(projectedBackgroundAssetId, visible);
                                    }
                                    function animateProjectedText(element, contentKey, animation, reducedMotion, durationMs = 350, animationTarget = null) {
                                        if (!element) return;
                                        const key = String(contentKey || '');
                                        const previous = element.dataset.projectionContentKey;
                                        element.dataset.projectionContentKey = key;
                                        if (previous === undefined || previous === key) return;
                                        const target = animationTarget || element.parentElement || element;
                                        const classes = ['projection-enter-fade','projection-enter-slide-up','projection-enter-slide-left','projection-enter-slide-down','projection-enter-slide-right','projection-enter-zoom','projection-enter-blur','projection-enter-reveal'];
                                        target.classList.remove(...classes);
                                        const animationClass = 'projection-enter-' + animation;
                                        if (animation === 'none' || reducedMotion || !classes.includes(animationClass)) return;
                                        target.style.setProperty('animation-duration', Math.min(5000, Math.max(100, Number(durationMs) || 350)) + 'ms', 'important');
                                        void target.offsetWidth;
                                        target.classList.add(animationClass);
                                    }
                                    function applyProjectedKaraokeBackground(element, style = {}) {
                                        if (!element) return;
                                        const transparent = style.transparent === true;
                                        const mode = String(style.bgType || 'color');
                                        const image = String(style.bgImage || '');
                                        const gradient = String(style.bgGradient || 'linear-gradient(135deg,#020617,#1e1b4b)');
                                        const color = String(style.bgColor || '#000000');
                                        const opacityValue = style.bgOpacity === undefined ? 100 : Number(style.bgOpacity);
                                        const opacity = Math.max(0, Math.min(100, Number.isFinite(opacityValue) ? opacityValue : 100)) / 100;
                                        const previous = element._projectionKaraokeBackgroundStyle;
                                        if (!previous || previous.opacity !== opacity) element.style.opacity = String(opacity);
                                        if (!previous || previous.transparent !== transparent || previous.mode !== mode || previous.image !== image || previous.gradient !== gradient || previous.color !== color) {
                                            if (transparent) { element.style.background='transparent'; element.style.backgroundImage='none'; }
                                            else if (mode==='image' && image) { element.style.background='none'; element.style.backgroundImage='url("'+image.replace(/"/g,'%22')+'")'; element.style.backgroundSize='cover'; element.style.backgroundPosition='center'; }
                                            else if (mode==='gradient') { element.style.background=gradient; element.style.backgroundImage='none'; }
                                            else { element.style.background=color; element.style.backgroundImage='none'; }
                                        }
                                        element._projectionKaraokeBackgroundStyle = { transparent, mode, image, gradient, color, opacity };
                                    }
                                    let lastAcceptedProjection = null;
                                    let mediaTransitionSequence = 0;
                                    let activeMediaTransition = null;
                                    function projectionScene(data) {
                                        if (!data || data.isBlackout || data.mediaMode === 'screen') return '';
                                        if (data.mediaMode === 'video' || data.mediaMode === 'youtube') return data.mediaMode;
                                        if (data.isStandby) return 'standby';
                                        const karaoke = data.karaoke || {};
                                        if (karaoke.active && String(karaoke.stanza || '').trim()) return 'karaoke';
                                        return 'verse';
                                    }
                                    function captureVideoPrompt(message) {
                                        const prompt = document.getElementById('proj-enable-audio');
                                        if (!prompt) return;
                                        prompt.textContent = message;
                                        prompt.classList.remove('hidden');
                                    }
                                    function reportCapturePlaybackState(video, state, errorMessage = '') {
                                        if (!channel || !video) return;
                                        const captureTrack = video.srcObject && typeof video.srcObject.getVideoTracks === 'function'
                                            ? video.srcObject.getVideoTracks()[0]
                                            : null;
                                        const captureSettings = captureTrack && typeof captureTrack.getSettings === 'function' ? captureTrack.getSettings() : {};
                                        try {
                                            channel.postMessage({
                                                type: '__screen_capture_playback_status',
                                                projectorId: projectorInstanceId,
                                                sessionId: projectorScreenSessionId || '',
                                                state,
                                                width: Number(video.videoWidth) || 0,
                                                height: Number(video.videoHeight) || 0,
                                                frameRate: Number(captureSettings.frameRate) || 0,
                                                readyState: Number(video.readyState) || 0,
                                                paused: !!video.paused,
                                                error: String(errorMessage || '').slice(0, 180),
                                                timestamp: Date.now()
                                            });
                                        } catch (_) {}
                                    }
                                    function confirmCaptureVideoFrame(video) {
                                        if (!video || video.videoWidth <= 0 || video.videoHeight <= 0 || video.paused || video.readyState < HTMLMediaElement.HAVE_CURRENT_DATA) return false;
                                        if (latestProjectionData?.isBlackout) return false;
                                        video.dataset.capturePlayAttempts = '0';
                                        projectorScreenVideoConfirmed = true;
                                        video.style.opacity = '1';
                                        video.classList.remove('hidden');
                                        clearProjectorScreenFrameFallback();
                                        ['proj-text', 'proj-citation', 'proj-backdrop', 'proj-overlay', 'proj-logo-standby', 'proj-logo-corner', 'proj-karaoke'].forEach(id => {
                                            const layer = document.getElementById(id);
                                            if (layer) layer.classList.add('hidden');
                                        });
                                        const prompt = document.getElementById('proj-enable-audio');
                                        if (prompt) prompt.classList.add('hidden');
                                        reportCapturePlaybackState(video, 'playing');
                                        return true;
                                    }
                                    function retryCaptureVideo(video) {
                                        if (!video || video.dataset.captureRetryPending === 'true') return;
                                        const attempts = Number(video.dataset.capturePlayAttempts) || 0;
                                        if (attempts >= 60) {
                                            const prompt = document.getElementById('proj-enable-audio');
                                            if (prompt && latestProjectionData?.mediaMode === 'screen') prompt.classList.add('hidden');
                                            reportCapturePlaybackState(video, 'no-frames');
                                            return;
                                        }
                                        video.dataset.capturePlayAttempts = String(attempts + 1);
                                        video.dataset.captureRetryPending = 'true';
                                        setTimeout(() => {
                                            video.dataset.captureRetryPending = 'false';
                                            if (latestProjectionData && latestProjectionData.mediaMode === 'screen' && video.srcObject) requestCaptureVideoPlayback(video);
                                        }, 350);
                                    }
                                    function requestCaptureVideoPlayback(video) {
                                        if (!video || !video.srcObject) return;
                                        video.muted = !projectorScreenAudioEnabled;
                                        video.playsInline = true;
                                        video.autoplay = true;
                                        if (latestProjectionData?.mediaMode === 'screen' && video.videoWidth <= 0) {
                                            const prompt = document.getElementById('proj-enable-audio');
                                            if (prompt) prompt.classList.add('hidden');
                                        }
                                        if (video.dataset.captureEventsBound !== 'true') {
                                            video.dataset.captureEventsBound = 'true';
                                            ['loadedmetadata', 'loadeddata', 'canplay', 'playing', 'resize'].forEach(name => video.addEventListener(name, () => {
                                                if (!confirmCaptureVideoFrame(video) && name === 'loadedmetadata') reportCapturePlaybackState(video, 'waiting');
                                            }));
                                            video.srcObject.getVideoTracks().forEach(track => track.addEventListener('ended', () => reportCapturePlaybackState(video, 'ended'), { once: true }));
                                        }
                                        reportCapturePlaybackState(video, 'waiting');
                                        let playAttempt;
                                        try { playAttempt = video.play(); }
                                        catch (error) {
                                            console.warn('No se pudo iniciar la reproducción de captura:', error);
                                            const prompt = document.getElementById('proj-enable-audio');
                                            if (latestProjectionData?.mediaMode === 'screen') { if (prompt) prompt.classList.add('hidden'); }
                                            else captureVideoPrompt('▶ Toca para mostrar la captura');
                                            reportCapturePlaybackState(video, 'blocked', error && error.message);
                                            retryCaptureVideo(video);
                                            return;
                                        }
                                        Promise.resolve(playAttempt).then(() => {
                                            if (!confirmCaptureVideoFrame(video)) retryCaptureVideo(video);
                                        }).catch(error => {
                                            console.warn('Safari requiere activar o esperar la captura:', error);
                                            const prompt = document.getElementById('proj-enable-audio');
                                            if (latestProjectionData?.mediaMode === 'screen') { if (prompt) prompt.classList.add('hidden'); }
                                            else captureVideoPrompt(video.videoWidth > 0 ? '▶ Activar audio de la captura' : '▶ Toca para mostrar la captura');
                                            reportCapturePlaybackState(video, 'blocked', error && error.message);
                                            retryCaptureVideo(video);
                                        });
                                    }
                                    function isMediaTransitionBoundary(from, to) {
                                        const fromScene = projectionScene(from);
                                        const toScene = projectionScene(to);
                                        return !!fromScene && !!toScene && fromScene !== toScene;
                                    }
                                    function mediaTransitionTargetReady(pending) {
                                        if (!pending || pending.targetMode === 'none') return true;
                                        if (pending.targetMode === 'video') {
                                            const video = document.getElementById('proj-video');
                                            return !!video && !!video.getAttribute('src') && video.readyState >= 2;
                                        }
                                        if (pending.targetMode === 'youtube') return ytPlayerReady && ytPlayerState !== -1;
                                        return false;
                                    }
                                    function finishMediaTransition(token, force = false) {
                                        const pending = activeMediaTransition;
                                        if (!pending || pending.token !== token || (!force && (!pending.visualComplete || !mediaTransitionTargetReady(pending)))) return;
                                        activeMediaTransition = null;
                                        clearTimeout(pending.timeout);
                                        clearTimeout(pending.visualTimer);
                                        const curtain = document.getElementById('proj-transition-curtain');
                                        const clip = document.getElementById('proj-transition-video');
                                        const logoLayer = document.getElementById('proj-transition-logo');
                                        if (curtain) { curtain.onanimationend = null; curtain.className = 'projection-transition-curtain'; }
                                        if (clip) { clip.onended = null; clip.onerror = null; clip.onloadedmetadata = null; clip.pause(); clip.classList.remove('is-active'); }
                                        if (logoLayer) { logoLayer.onanimationend = null; logoLayer.className = 'projection-logo-transition'; }
                                    }
                                    function maybeFinishMediaTransition() {
                                        if (activeMediaTransition) finishMediaTransition(activeMediaTransition.token);
                                    }
                                    function runBuiltInMediaTransition(pending, effect, logoUrl = '', durationMs = 700) {
                                        const curtain = document.getElementById('proj-transition-curtain');
                                        const clip = document.getElementById('proj-transition-video');
                                        const logoLayer = document.getElementById('proj-transition-logo');
                                        const logoImage = document.getElementById('proj-transition-logo-image');
                                        if (!curtain || !pending || activeMediaTransition !== pending) return;
                                        if (clip) { clip.onended = null; clip.onerror = null; clip.onloadedmetadata = null; clip.pause(); clip.classList.remove('is-active'); }
                                        if (logoLayer) { logoLayer.onanimationend = null; logoLayer.className = 'projection-logo-transition'; }
                                        const safeDuration = Math.min(6000, Math.max(300, Number(durationMs) || 700));
                                        if (effect === 'logo' && logoUrl && logoLayer && logoImage) {
                                            curtain.className = 'projection-transition-curtain';
                                            logoImage.src = logoUrl;
                                            logoLayer.style.setProperty('animation-duration', safeDuration + 'ms', 'important');
                                            logoImage.style.setProperty('animation-duration', safeDuration + 'ms', 'important');
                                            logoLayer.className = 'projection-logo-transition is-active';
                                            void logoLayer.offsetWidth;
                                            logoLayer.classList.add('is-playing');
                                            logoLayer.onanimationend = event => {
                                                if (event.target !== logoLayer) return;
                                                if (activeMediaTransition !== pending) return;
                                                pending.visualComplete = true;
                                                logoLayer.className = 'projection-logo-transition';
                                                if (!mediaTransitionTargetReady(pending)) curtain.className = 'projection-transition-curtain is-active is-held';
                                                maybeFinishMediaTransition();
                                            };
                                            pending.visualTimer = setTimeout(() => {
                                                if (activeMediaTransition !== pending || pending.visualComplete) return;
                                                pending.visualComplete = true;
                                                logoLayer.className = 'projection-logo-transition';
                                                if (!mediaTransitionTargetReady(pending)) curtain.className = 'projection-transition-curtain is-active is-held';
                                                maybeFinishMediaTransition();
                                            }, safeDuration + 120);
                                            return;
                                        }
                                        if (effect === 'logo') sendProjectionAssetStatus('transition', '', 'No hay logo de iglesia cargado; se usó el fundido a negro.');
                                        const safeEffect = ['fade','wipe','zoom'].includes(effect) ? effect : 'fade';
                                        curtain.style.setProperty('animation-duration', safeDuration + 'ms', 'important');
                                        curtain.className = 'projection-transition-curtain is-active is-held';
                                        void curtain.offsetWidth;
                                        curtain.classList.remove('is-held');
                                        curtain.classList.add('effect-' + safeEffect);
                                        curtain.onanimationend = () => {
                                            if (activeMediaTransition !== pending) return;
                                            pending.visualComplete = true;
                                            curtain.className = 'projection-transition-curtain is-active is-held';
                                            maybeFinishMediaTransition();
                                        };
                                        pending.visualTimer = setTimeout(() => {
                                            if (activeMediaTransition !== pending || pending.visualComplete) return;
                                            pending.visualComplete = true;
                                            curtain.className = 'projection-transition-curtain is-active is-held';
                                            maybeFinishMediaTransition();
                                        }, safeDuration + 150);
                                    }
                                    async function startMediaTransition(data) {
                                        const effect = data.styles && data.styles.mediaTransition || 'fade';
                                        if (effect === 'none') return;
                                        const durationMs = Math.min(6000, Math.max(300, Number(data.styles.mediaTransitionDurationMs) || 700));
                                        const logoUrl = String(data.styles.logoUrl || '');
                                        const token = ++mediaTransitionSequence;
                                        if (activeMediaTransition) {
                                            clearTimeout(activeMediaTransition.timeout);
                                            clearTimeout(activeMediaTransition.visualTimer);
                                        }
                                        const pending = { token, targetMode: data.mediaMode, visualComplete: false, timeout: 0, visualTimer: 0, durationMs };
                                        activeMediaTransition = pending;
                                        const curtain = document.getElementById('proj-transition-curtain');
                                        const clip = document.getElementById('proj-transition-video');
                                        const logoLayer = document.getElementById('proj-transition-logo');
                                        const assetId = String(data.styles.transitionVideoId || '');
                                        const logoOnly = effect === 'logo' && !assetId && !!logoUrl;
                                        if (curtain) curtain.className = logoOnly ? 'projection-transition-curtain' : 'projection-transition-curtain is-active is-held';
                                        if (clip) { clip.pause(); clip.classList.remove('is-active'); clip.onended = null; clip.onerror = null; clip.onloadedmetadata = null; }
                                        if (logoLayer) { logoLayer.onanimationend = null; logoLayer.className = 'projection-logo-transition'; }
                                        pending.timeout = setTimeout(() => finishMediaTransition(token, true), 10000);
                                        if (assetId && clip) {
                                            try {
                                                const url = await getProjectorMediaUrl(assetId);
                                                if (activeMediaTransition !== pending) return;
                                                clip.src = url; clip.muted = true; clip.defaultMuted = true; clip.playsInline = true;
                                                clip.setAttribute('muted', ''); clip.setAttribute('playsinline', '');
                                                clip.onloadedmetadata = () => {
                                                    try {
                                                        const targetSeconds = durationMs / 1000;
                                                        if (Number.isFinite(clip.duration) && clip.duration > 0 && targetSeconds > 0) {
                                                            clip.playbackRate = Math.min(2, Math.max(.15, clip.duration / targetSeconds));
                                                        }
                                                    } catch (_) {}
                                                };
                                                clip.load();
                                                clip.onended = () => {
                                                    clip.classList.remove('is-active');
                                                    if (curtain) curtain.className = 'projection-transition-curtain is-active is-held';
                                                    const elapsed = Date.now() - (pending.startedAt || Date.now());
                                                    const remaining = Math.max(0, durationMs - elapsed);
                                                    pending.visualTimer = setTimeout(() => {
                                                        if (activeMediaTransition !== pending) return;
                                                        pending.visualComplete = true;
                                                        sendProjectionAssetStatus('transition', assetId, 'Transición personalizada reproducida');
                                                        maybeFinishMediaTransition();
                                                    }, remaining);

                                        catch (error) { console.warn('No se pudo preparar el fotograma recibido:', error); return; }
                                        projectorScreenFrameTimestamp = Number(message.timestamp) || Date.now();
                                        projectorScreenFrameSequence = Number(message.sequence) || 0;
                                        projectorScreenFrameSessionId = message.sessionId;
                                        image.dataset.pendingObjectUrl = objectUrl;
                                        const acknowledge = () => {
                                            try {
                                                if (channel) channel.postMessage({
                                                    type: '__screen_capture_frame_ack',
                                                    projectorId: projectorInstanceId,
                                                    sessionId: message.sessionId,
                                                    sequence: Number(message.sequence) || 0,
                                                    width: Number(message.width) || image.naturalWidth || 0,
                                                    height: Number(message.height) || image.naturalHeight || 0,
                                                    timestamp: Date.now()
                                                });
                                            } catch (_) {}
                                        };
                                        image.onload = () => {
                                            if (latestProjectionData?.mediaMode !== 'screen' || latestProjectionData?.isBlackout || Number(message.sequence) !== projectorScreenFrameSequence || projectorScreenVideoConfirmed) {
                                                try { URL.revokeObjectURL(objectUrl); } catch (_) {}
                                                if (image.dataset.pendingObjectUrl === objectUrl) image.dataset.pendingObjectUrl = '';
                                                acknowledge();
                                                return;
                                            }
                                            const previousObjectUrl = projectorScreenFrameObjectUrl;
                                            projectorScreenFrameObjectUrl = objectUrl;
                                            image.dataset.pendingObjectUrl = '';
                                            if (previousObjectUrl && previousObjectUrl !== objectUrl) { try { URL.revokeObjectURL(previousObjectUrl); } catch (_) {} }
                                            if (!projectorScreenVideoConfirmed) {
                                                const screenVideo = document.getElementById('proj-screen-video');
                                                if (screenVideo) { screenVideo.classList.remove('hidden'); screenVideo.style.opacity = '1'; }
                                                image.classList.remove('hidden');
                                                ['proj-text', 'proj-citation', 'proj-backdrop', 'proj-overlay', 'proj-logo-standby', 'proj-logo-corner', 'proj-karaoke'].forEach(id => {
                                                    const layer = document.getElementById(id);
                                                    if (layer) layer.classList.add('hidden');
                                                });
                                                const prompt = document.getElementById('proj-enable-audio');
                                                if (prompt) prompt.classList.add('hidden');
                                                if (projectorScreenFallbackStatusSessionId !== message.sessionId) {
                                                    projectorScreenFallbackStatusSessionId = message.sessionId;
                                                    try {
                                                        if (channel) channel.postMessage({ type: '__screen_capture_playback_status', projectorId: projectorInstanceId, sessionId: message.sessionId, state: 'fallback-playing', width: image.naturalWidth, height: image.naturalHeight, frameRate: Number(message.frameRate) || 0, timestamp: Date.now() });
                                                    } catch (_) {}
                                                }
                                            }
                                            acknowledge();
                                        };
                                        image.onerror = () => {
                                            image.classList.add('hidden');
                                            try { URL.revokeObjectURL(objectUrl); } catch (_) {}
                                            if (image.dataset.pendingObjectUrl === objectUrl) image.dataset.pendingObjectUrl = '';
                                        };
                                        image.src = objectUrl;
                                    }
                                    function closeProjectorScreenPeer() {
                                        if (projectorScreenSessionId) projectorPendingScreenCandidates.delete(projectorScreenSessionId);
                                        try { if (projectorScreenPeer) projectorScreenPeer.close(); } catch (_) {}
                                        projectorScreenPeer = null;
                                        projectorScreenSessionId = '';
                                        projectorScreenAudioEnabled = false;
                                        projectorScreenRemoteDescriptionApplied = false;
                                        projectorScreenPendingOfferCandidates = [];
                                        projectorScreenVideoConfirmed = false;
                                        clearProjectorScreenFrameFallback();
                                        const screenVideo = document.getElementById('proj-screen-video');
                                        if (screenVideo) {
                                            const keepDirectCapture = screenVideo.dataset.directScreenCapture === 'true' && latestProjectionData?.mediaMode === 'screen';
                                            if (!keepDirectCapture) {
                                                try { if (screenVideo.srcObject) screenVideo.srcObject.getTracks().forEach(track => track.stop()); } catch (_) {}
                                                screenVideo.pause(); screenVideo.srcObject = null; screenVideo.dataset.directScreenCapture = 'false'; screenVideo.classList.add('hidden');
                                            }
                                        }
                                    }
                                    function receiveProjectorScreenCandidate(message) {
                                        if (!message || message.projectorId !== projectorInstanceId || message.direction !== 'offer' || !message.sessionId || !message.candidate) return;
                                        if (!projectorScreenPeer || message.sessionId !== projectorScreenSessionId) {
                                            const pending = projectorPendingScreenCandidates.get(message.sessionId) || [];
                                            if (pending.length < 32) pending.push(message.candidate);
                                            projectorPendingScreenCandidates.set(message.sessionId, pending);
                                            while (projectorPendingScreenCandidates.size > 5) projectorPendingScreenCandidates.delete(projectorPendingScreenCandidates.keys().next().value);
                                            return;
                                        }
                                        const candidate = new RTCIceCandidate(message.candidate);
                                        if (!projectorScreenRemoteDescriptionApplied) projectorScreenPendingOfferCandidates.push(candidate);
                                        else projectorScreenPeer.addIceCandidate(candidate).catch(error => console.warn('No se pudo añadir un candidato ICE de la consola:', error));
                                    }
                                    async function handleScreenOffer(offer) {
                                        if (!offer || !offer.sessionId || !offer.sdp || offer.projectorId !== projectorInstanceId) return;
                                        if (offer.sessionId === projectorScreenSessionId) return;
                                        const earlyCandidates = projectorPendingScreenCandidates.get(offer.sessionId) || [];
                                        projectorPendingScreenCandidates.delete(offer.sessionId);
                                        closeProjectorScreenPeer();
                                        projectorScreenSessionId = offer.sessionId;
                                        projectorScreenPendingOfferCandidates = earlyCandidates.map(candidate => new RTCIceCandidate(candidate));
                                        projectorScreenVideoConfirmed = false;
                                        clearProjectorScreenFrameFallback();
                                        try {
                                            const pc = new RTCPeerConnection({ iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] });
                                            projectorScreenPeer = pc;
                                            pc.onicecandidate = event => {
                                                if (!event.candidate || projectorScreenSessionId !== offer.sessionId || projectorScreenPeer !== pc) return;
                                                const candidate = typeof event.candidate.toJSON === 'function' ? event.candidate.toJSON() : event.candidate;
                                                channel.postMessage({ type: '__screen_capture_candidate', direction: 'answer', sessionId: offer.sessionId, projectorId: projectorInstanceId, candidate, timestamp: Date.now() });
                                            };
                                            let receivedScreenStream = null;
                                            pc.ontrack = event => {
                                                const screenVideo = document.getElementById('proj-screen-video');
                                                if (!screenVideo) return;
                                                let remoteStream;
                                                if (event.streams && event.streams[0]) remoteStream = event.streams[0];
                                                else {
                                                    if (!receivedScreenStream) receivedScreenStream = new MediaStream();
                                                    if (!receivedScreenStream.getTracks().includes(event.track)) receivedScreenStream.addTrack(event.track);
                                                    remoteStream = receivedScreenStream;
                                                }
                                                // La captura se envía por WebRTC a esta ventana; el MediaStream
                                                // original permanece solo en la consola y su vista previa.
                                                screenVideo.dataset.directScreenCapture = 'false';
                                                projectorScreenVideoConfirmed = false;
                                                screenVideo.srcObject = remoteStream;
                                                reportCapturePlaybackState(screenVideo, 'track-received');
                                                const isLiveProjection = !!(latestProjectionData && latestProjectionData.mediaMode === 'screen');
                                                screenVideo.volume = 1;
                                                if (isLiveProjection) { screenVideo.classList.remove('hidden'); screenVideo.style.opacity = '1'; }
                                                else screenVideo.classList.add('hidden');
                                                if (isLiveProjection) requestCaptureVideoPlayback(screenVideo);
                                            };
                                            pc.onconnectionstatechange = () => {
                                                if (['failed', 'closed'].includes(pc.connectionState)) {
                                                    const screenVideo = document.getElementById('proj-screen-video');
                                                    if (screenVideo && screenVideo.dataset.directScreenCapture !== 'true') screenVideo.classList.add('hidden');
                                                }
                                            };
                                            await pc.setRemoteDescription({ type: 'offer', sdp: offer.sdp });
                                            projectorScreenRemoteDescriptionApplied = true;
                                            for (const candidate of projectorScreenPendingOfferCandidates.splice(0)) await pc.addIceCandidate(candidate);
                                            const answer = await pc.createAnswer();
                                            await pc.setLocalDescription(answer);
                                            const screenAnswer = { sessionId: offer.sessionId, type: 'answer', sdp: pc.localDescription.sdp, timestamp: Date.now(), projectorId: projectorInstanceId };
                                            channel.postMessage({ type: '__screen_capture_answer', ...screenAnswer });
                                        } catch (error) { console.error('No se pudo recibir el vídeo de pantalla por WebRTC:', error); closeProjectorScreenPeer(); }
                                    }

                                    const projectedVideoElement = document.getElementById('proj-video');
                                    if (projectedVideoElement) {
                                        ['loadedmetadata', 'loadeddata', 'durationchange', 'play', 'playing', 'pause', 'seeked', 'ended', 'timeupdate', 'waiting', 'resize', 'error'].forEach(eventName => {
                                            projectedVideoElement.addEventListener(eventName, () => sendProjectorVideoStatus(eventName !== 'timeupdate'));
                                        });
                                        ['loadeddata','canplay','playing'].forEach(eventName => projectedVideoElement.addEventListener(eventName, maybeFinishMediaTransition));
                                    }
                                    startProjectorMirror();

                                    // Safari puede bloquear audio iniciado desde otra ventana. Si sucede,
                                    // permite activar el video con un gesto dentro de esta ventana.
                                    const audioPrompt = document.getElementById('proj-enable-audio');
                                    if (audioPrompt) audioPrompt.addEventListener('click', () => {
                                        const screenVideo = document.getElementById('proj-screen-video');
                                        const useScreenCapture = !!(latestProjectionData?.mediaMode === 'screen' && screenVideo && screenVideo.srcObject);
                                        const video = useScreenCapture ? screenVideo : (screenVideo && !screenVideo.classList.contains('hidden') ? screenVideo : document.getElementById('proj-video'));
                                        if (!video) return;
                                        const isScreenCapture = video.id === 'proj-screen-video';
                                        const isScreenSource = isScreenCapture || (latestProjectionData?.mediaMode === 'screen' && !!video.srcObject);
                                        const hasAudio = isScreenSource && video.srcObject && video.srcObject.getAudioTracks().some(track => track.readyState === 'live');
                                        if (isScreenSource) projectorScreenAudioEnabled = !!hasAudio;
                                        video.muted = isScreenSource ? !projectorScreenAudioEnabled : false; video.volume = 1;
                                        if (isScreenSource) {
                                            video.dataset.capturePlayAttempts = '0';
                                            video.classList.remove('hidden');
                                            video.style.opacity = '1';
                                            requestCaptureVideoPlayback(video);
                                        } else video.play().then(() => audioPrompt.classList.add('hidden')).catch(() => { audioPrompt.textContent = 'No se pudo iniciar el audio'; });
                                    });

                                    // Recupera el último estado al abrir o recargar la ventana de proyección.
                                    try {
                                        const saved = localStorage.getItem(STORAGE_KEY);
                                        if (saved) applyProjection(JSON.parse(saved));
                                    } catch (error) { console.warn('No se pudo recuperar el estado guardado', error); }
                                    window.addEventListener('pagehide', event => {
                                        if (event.persisted) return;
                                        for (const url of projectorMediaUrls.values()) { try { URL.revokeObjectURL(url); } catch (_) {} }
                                        projectorMediaUrls.clear();
                                    });
                                })();
                            </script>
                        </body>
                        </html>

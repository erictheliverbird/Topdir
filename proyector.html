<!DOCTYPE html>
                        <html lang="es" class="h-full">
                        <head>
                            <meta charset="UTF-8">
                            <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
                            <meta name="theme-color" content="#000000">
                            <meta name="apple-mobile-web-app-capable" content="yes">
                            <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
                            <link rel="icon" type="image/png" href="icon-192.png">
                            <title>Proyección en Vivo - Pantalla Externa</title>
                            <script src="https://cdn.tailwindcss.com"></script>
                            <link href="https://fonts.googleapis.com/css2?family=Amatic+SC:wght@400;700&family=Cinzel:wght@500;700;900&family=EB+Garamond:ital,wght@0,400;0,700;1,400&family=Inter:wght@300;400;500;600;700;800&family=Lora:ital,wght@0,400;0,700;1,400&family=Merriweather:wght@300;400;700&family=Montserrat:wght@400;600;800&family=Open+Sans:wght@300;400;600;700&family=Oswald:wght@400;700&family=Playfair+Display:ital,wght@0,600;0,800;1,400&family=Poppins:wght@300;400;600;700&family=Quicksand:wght@400;600;700&family=Raleway:wght@300;400;600;700&family=Roboto+Slab:wght@400;700&family=Ubuntu:wght@400;700&family=Fira+Sans:wght@400;600;700&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Source+Sans+3:wght@400;600;700&family=Spectral:ital,wght@0,400;0,700;1,400&family=Crimson+Text:ital,wght@0,400;0,700;1,400&family=Cardo:wght@400;700&family=Josefin+Sans:wght@400;600;700&family=Nunito+Sans:wght@400;600;700&family=PT+Serif:ital,wght@0,400;0,700;1,400&family=Archivo+Black&display=swap" rel="stylesheet">
                            <style>
                                :root { color-scheme: dark; }
                                html, body { width: 100%; height: 100%; min-height: 100%; margin: 0; padding: 0; overflow: hidden; background: #000; }
                                body { height: 100vh; height: 100dvh; padding: max(2.5vw, env(safe-area-inset-top)) max(2.5vw, env(safe-area-inset-right)) max(2.5vw, env(safe-area-inset-bottom)) max(2.5vw, env(safe-area-inset-left)) !important; box-sizing: border-box; }
                                #proj-fullscreen-prompt { font-family: Inter, system-ui, sans-serif; }
                                .text-projection-shadow { text-shadow: 0 2px 12px rgba(0,0,0,0.95), 0 4px 24px rgba(0,0,0,0.85); }
                            </style>
                            <link rel="stylesheet" href="responsive.css">
                        </head>
                        <body class="projection-page h-screen w-screen overflow-hidden relative flex flex-col justify-between p-16 select-none bg-black">
                            <button id="proj-fullscreen-prompt" type="button" class="fixed left-1/2 top-4 z-[100] -translate-x-1/2 rounded-xl border border-white/30 bg-black/85 px-5 py-3 text-sm font-bold text-white shadow-2xl" style="display:none">⛶ Activar pantalla completa</button>
                            <div id="proj-backdrop" class="absolute inset-0 z-0 bg-cover bg-center transition-all duration-300"></div>
                            <video id="proj-video" class="absolute inset-0 w-full h-full object-contain bg-black z-10 hidden" playsinline autoplay></video>
                            <button id="proj-enable-audio" type="button" class="absolute z-50 hidden left-1/2 top-1/2 -translate-x-1/2 -translate-y-1/2 rounded-xl bg-black/85 border border-white/40 px-6 py-4 text-white text-lg font-bold shadow-2xl" style="pointer-events:auto">▶ Toca para reproducir con sonido</button>

                            <video id="proj-screen-video" class="absolute inset-0 w-full h-full object-contain bg-black z-10 hidden" playsinline autoplay></video>
                            <div id="proj-youtube" title="Reproductor de YouTube (proyección)" class="absolute inset-0 w-full h-full bg-black z-10 hidden overflow-hidden" aria-label="Reproductor de YouTube" style="contain:layout paint; clip-path:inset(0)"><div id="proj-youtube-player" data-youtube-api="1" class="absolute inset-0 w-full h-full"></div></div>
                            <div id="proj-overlay" class="absolute inset-0 z-20 bg-black/40 transition-all duration-300"></div>
                            <img id="proj-logo-standby" class="absolute left-1/2 top-1/2 -translate-x-1/2 -translate-y-1/2 max-w-[40%] max-h-[60%] object-contain z-30 hidden" alt="Standby Logo" />
                            <img id="proj-logo-corner" class="absolute max-w-[12%] max-h-[15%] object-contain z-30 hidden" alt="Corner Logo" />
                            <div id="proj-karaoke" class="absolute inset-0 z-40 hidden flex items-center justify-center px-[8%] py-[6%] pointer-events-none"><div id="proj-karaoke-bg" class="absolute inset-0 z-0 pointer-events-none"></div><div id="proj-karaoke-stanza" class="relative z-10 w-full whitespace-pre-line leading-relaxed text-center"></div></div>
                            <div class="z-30 text-center w-full my-auto px-12">
                                <p id="proj-text" class="text-white leading-relaxed"></p>
                            </div>
                            <div class="z-30 text-center w-full pb-6">
                                <p id="proj-citation" class="text-white/90 tracking-widest font-black uppercase text-2xl"></p>
                            </div>
                            <script>
                                // Receptor autónomo: la proyección sigue escuchando aunque Safari
                                // separe esta pestaña y ya no podamos manipular su document desde la consola.
                                (() => {
                                    const CHANNEL_NAME = 'biblical-projector-channel';
                                    const STORAGE_KEY = 'biblical_projector_data';
                                    const projectorInstanceId = Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 10);
                                    const projectorControllerId = new URLSearchParams(window.location.search).get('controller') || '';
                                    let channel = null;

                                    // Pantalla completa: Safari solo permite solicitarla de forma fiable
                                    // tras un gesto del usuario. En modo app instalado, no hace falta el aviso.
                                    const fullscreenPrompt = document.getElementById('proj-fullscreen-prompt');
                                    const isStandalone = () => window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
                                    const updateFullscreenPrompt = () => {
                                        if (!fullscreenPrompt) return;
                                        fullscreenPrompt.style.display = (!isStandalone() && !document.fullscreenElement) ? 'block' : 'none';
                                    };
                                    if (fullscreenPrompt) fullscreenPrompt.addEventListener('click', async () => {
                                        try {
                                            const target = document.documentElement;
                                            if (target.requestFullscreen) await target.requestFullscreen();
                                            else if (document.body.requestFullscreen) await document.body.requestFullscreen();
                                        } catch (error) {
                                            fullscreenPrompt.textContent = 'Safari no permite pantalla completa aquí. Añade la app a Inicio.';
                                        }
                                        updateFullscreenPrompt();
                                    });
                                    document.addEventListener('fullscreenchange', updateFullscreenPrompt);
                                    window.addEventListener('resize', updateFullscreenPrompt);
                                    window.addEventListener('orientationchange', updateFullscreenPrompt);
                                    updateFullscreenPrompt();

                                    // Un solo reproductor YT.Player persistente en la página de proyección.
                                    // Los nuevos videos se ponen en cola hasta que el player confirme CUED,
                                    // evitando que las órdenes del controlador lleguen antes que el iframe.
                                    let ytPlayer = null;
                                    let ytApiReady = false;
                                    let ytPlayerReady = false;
                                    let ytDesiredVideoId = '';
                                    let ytCueIssuedId = '';
                                    let ytPendingVideoId = '';
                                    let ytPendingCommand = '';
                                    let ytPlayerState = -1;
                                    let ytLoopEnabled = false;
                                    let ytSeparateWindowMode = false; // YouTube comparte la ventana del proyector con los versículos.
                                    let ytLastStatus = '';
                                    let ytPendingTarget = null;

                                    function getYouTubeId(value) {
                                        try {
                                            const u = new URL(value, location.href);
                                            const host = u.hostname.toLowerCase().replace(/^www\./, '');
                                            let videoId = '';
                                            if (host === 'youtu.be') videoId = u.pathname.split('/').filter(Boolean)[0] || '';
                                            else if (['youtube.com', 'm.youtube.com', 'music.youtube.com'].includes(host)) {
                                                if (u.pathname === '/watch') videoId = u.searchParams.get('v') || '';
                                                else if (/^\/(embed|shorts)\//.test(u.pathname)) videoId = u.pathname.split('/')[2] || '';
                                            }
                                            return /^[A-Za-z0-9_-]{11}$/.test(videoId) ? videoId : '';
                                        } catch (_) { return ''; }
                                    }
                                    function publishYouTubePlaybackStatus(extra = {}) {
                                        if (!ytPlayerReady || !ytPlayer || !ytDesiredVideoId) return;
                                        let currentTime = 0, duration = 0, playerState = ytPlayerState;
                                        try { currentTime = Number(ytPlayer.getCurrentTime()) || 0; } catch (_) {}
                                        try { duration = Number(ytPlayer.getDuration()) || 0; } catch (_) {}
                                        try { playerState = Number(ytPlayer.getPlayerState()); } catch (_) {}
                                        const status = {
                                            videoId: ytDesiredVideoId,
                                            status: ytLastStatus,
                                            currentTime: Math.max(0, currentTime),
                                            duration: Math.max(0, duration),
                                            playerState,
                                            playing: playerState === 1,
                                            paused: playerState === 2,
                                            timestamp: Date.now(),
                                            ...extra
                                        };
                                        try { if (channel) channel.postMessage({ type: '__youtube_status', ...status }); } catch (_) {}
                                    }
                                    function sendYouTubeStatus(status, extra = {}) {
                                        if (status === ytLastStatus && !extra.force) { publishYouTubePlaybackStatus(); return; }
                                        ytLastStatus = status;
                                        const details = { ...extra };
                                        delete details.force;
                                        publishYouTubePlaybackStatus(details);
                                    }
                                    function executeYouTubeCommand(command, target = null) {
                                        if (!ytPlayerReady || !ytPlayer || !command) { ytPendingCommand = command || ytPendingCommand; ytPendingTarget = target; return; }
                                        if (command === 'playVideo') {
                                            if (ytPlayerState === -1 || !ytCueIssuedId) { ytPendingCommand = command; return; }
                                            ytPendingCommand = '';
                                            try { ytPlayer.playVideo(); } catch (_) { ytPendingCommand = command; }
                                        } else if (command === 'pauseVideo') {
                                            ytPendingCommand = '';
                                            try { ytPlayer.pauseVideo(); } catch (_) {}
                                        } else if (command === 'stopVideo') {
                                            ytPendingCommand = '';
                                            ytPendingTarget = null;
                                            try { ytPlayer.stopVideo(); } catch (_) {}
                                        } else if (command === 'seekTo') {
                                            const seekTarget = Number(target);
                                            if (!Number.isFinite(seekTarget) || seekTarget < 0) return;
                                            ytPendingCommand = '';
                                            ytPendingTarget = null;
                                            try { ytPlayer.seekTo(seekTarget, true); publishYouTubePlaybackStatus(); } catch (_) {}
                                        }
                                    }
                                    function cueYouTubeVideo(videoId) {
                                        if (!videoId) return;
                                        ytDesiredVideoId = videoId;
                                        ytPendingVideoId = videoId;
                                        ytCueIssuedId = '';
                                        ytPlayerState = -1;
                                        if (!ytPlayerReady || !ytPlayer) return;
                                        try {
                                            ytCueIssuedId = videoId;
                                            ytPendingVideoId = '';
                                            ytPlayer.cueVideoById({ videoId, startSeconds: 0 });
                                            sendYouTubeStatus('video-cued', { videoId });
                                        } catch (error) {
                                            ytPendingVideoId = videoId;
                                            sendYouTubeStatus('player-error', { message: String(error) });
                                        }
                                    }
                                    function initializeYouTubeAPI() {
                                        window.onYouTubeIframeAPIReady = () => {
                                            ytApiReady = true;
                                            // Los controles oficiales permiten usar «Saltar anuncio» cuando YouTube lo habilita.
                                            const playerVars = { autoplay: 0, controls: 1, enablejsapi: 1, playsinline: 1, rel: 0, fs: 1 };
                                            if (location.protocol === 'https:' || location.protocol === 'http:') playerVars.origin = location.origin;
                                            ytPlayer = new YT.Player('proj-youtube-player', {
                                                width: '100%', height: '100%', playerVars,
                                                events: {
                                                    onReady: event => {
                                                        ytPlayerReady = true;
                                                        try {
                                                            const frame = event.target.getIframe();
                                                            frame.setAttribute('allow', 'autoplay; encrypted-media; picture-in-picture; web-share; fullscreen');
                                                            frame.setAttribute('allowfullscreen', '');
                                                            frame.setAttribute('referrerpolicy', 'strict-origin-when-cross-origin');
                                                            frame.style.width = '100%'; frame.style.height = '100%'; frame.style.border = '0';
                                                        } catch (_) {}
                                                        if (ytPendingVideoId || ytDesiredVideoId) cueYouTubeVideo(ytPendingVideoId || ytDesiredVideoId);
                                                        sendYouTubeStatus('player-ready', { force: true });
                                                    },
                                                    onStateChange: event => {
                                                        ytPlayerState = event.data;
                                                        // 5 = CUED: ahora sí se puede ejecutar el Play que llegó antes.
                                                        if (event.data === 5 && ytPendingCommand) {
                                                            const queued = ytPendingCommand;
                                                            const queuedTarget = ytPendingTarget;
                                                            ytPendingCommand = '';
                                                            ytPendingTarget = null;
                                                            executeYouTubeCommand(queued, queuedTarget);
                                                        }
                                                        if (event.data === 1) sendYouTubeStatus('playing', { videoId: ytDesiredVideoId });
                                                        else if (event.data === 2) sendYouTubeStatus('paused', { videoId: ytDesiredVideoId });
                                                        else if (event.data === 0 && ytLoopEnabled) {
                                                            try { ytPlayer.seekTo(0, true); ytPlayer.playVideo(); } catch (_) {}
                                                        } else if (event.data === 5) sendYouTubeStatus('video-cued', { videoId: ytDesiredVideoId });
                                                    },
                                                    onError: event => sendYouTubeStatus('player-error', { code: event.data, videoId: ytDesiredVideoId }),
                                                    onAutoplayBlocked: () => sendYouTubeStatus('autoplay-blocked', { videoId: ytDesiredVideoId, force: true })
                                                }
                                            });
                                        };
                                        const script = document.createElement('script');
                                        script.src = 'https://www.youtube.com/iframe_api';
                                        script.onerror = () => sendYouTubeStatus('api-load-error', { force: true });
                                        document.head.appendChild(script);
                                    }
                                    // Un único reproductor YouTube dentro de la ventana real de proyección.
                                    // La vista previa del panel no crea ningún iframe ni reproduce audio.
                                    initializeYouTubeAPI();
                                    // El reproductor proyectado es la única fuente de tiempo/duración.
                                    // Se publica un estado ligero cada segundo para la barra del iPad.
                                    setInterval(publishYouTubePlaybackStatus, 1000);
                                    try {
                                        if ('BroadcastChannel' in window) {
                                            channel = new BroadcastChannel(CHANNEL_NAME);
                                            channel.addEventListener('message', event => {
                                                const data = event.data;
                                                if (data && data.type === '__youtube_command') {
                                                    handleYouTubeCommand(data.command, data.target);
                                                    [180, 500, 950].forEach(delay => setTimeout(() => handleYouTubeCommand(data.command, data.target), delay));
                                                    return;
                                                }
                                                if (data && data.type === '__local_video_control') {
                                                    if (data.projectorId === projectorInstanceId && data.command) {
                                                        handleProjectorVideoControl({ data: JSON.stringify(data.command) });
                                                    }
                                                    return;
                                                }
                                                if (data && (data.type === '__local_video_transfer_start' || data.type === '__local_video_transfer_chunk' || data.type === '__local_video_transfer_cancel')) {
                                                    handleLocalVideoTransferMessage(data);
                                                    return;
                                                }
                                                if (data && data.type === '__video_transfer_offer') {
                                                    handleVideoOffer(data);
                                                    return;
                                                }
                                                if (data && data.type === '__screen_capture_offer') {
                                                    handleScreenOffer(data);
                                                    return;
                                                }
                                                if (data && data.type === '__screen_capture_candidate') {
                                                    receiveProjectorScreenCandidate(data);
                                                    return;
                                                }
                                                if (data && data.type === '__screen_capture_stop') {
                                                    if (data.projectorId === projectorInstanceId && data.sessionId === projectorScreenSessionId) closeProjectorScreenPeer();
                                                    return;
                                                }
                                                if (data && (data.type === '__video_transfer_answer' || data.type === '__screen_capture_answer')) return;
                                                if (data && data.type === '__controller_hello') {
                                                    if (data.controllerId === projectorControllerId) sendProjectorHeartbeat();
                                                    return;
                                                }
                                                applyProjection(data);
                                            });
                                        }
                                    } catch (error) { console.warn('BroadcastChannel no disponible', error); }

                                    function sendProjectorHeartbeat() {
                                        try {
                                            if (channel) channel.postMessage({ type: '__projector_heartbeat', timestamp: Date.now(), page: location.pathname, projectorId: projectorInstanceId, controllerId: projectorControllerId });
                                        } catch (_) {}
                                    }
                                    // Latido periódico: el controlador sabe que esta página sigue viva
                                    // incluso después de separar la pestaña a otra ventana/pantalla.
                                    sendProjectorHeartbeat();
                                    setInterval(sendProjectorHeartbeat, 2000);
                                    window.addEventListener('pageshow', sendProjectorHeartbeat);
                                    document.addEventListener('visibilitychange', () => { if (!document.hidden) sendProjectorHeartbeat(); });

                                    function handleYouTubeCommand(command, target = null) {
                                        if (ytSeparateWindowMode) return; // Seguridad: no aceptar comandos si el modo independiente está activado.
                                        if (command !== 'playVideo' && command !== 'pauseVideo' && command !== 'stopVideo' && command !== 'seekTo') return;
                                        // Si el video está cargando o esperando CUED, guardar la orden.
                                        executeYouTubeCommand(command, target);
                                    }
                                    window.addEventListener('message', event => {
                                        const data = event.data;
                                        if (data && data.type === '__youtube_command') {
                                            handleYouTubeCommand(data.command, data.target);
                                            // Reintentar si el iframe aún está terminando de inicializarse.
                                            [150, 450, 900].forEach(delay => setTimeout(() => handleYouTubeCommand(data.command, data.target), delay));
                                            return;
                                        }
                                        applyProjection(data);
                                    });
                                    window.addEventListener('storage', event => {
                                        if (event.key === STORAGE_KEY && event.newValue) {
                                            try { applyProjection(JSON.parse(event.newValue)); } catch (_) {}
                                        }
                                    });

                                    function queueProjectionSeek(video, target) {
                                        if (!video || !Number.isFinite(target) || target < 0) return;
                                        const applyTarget = () => {
                                            const duration = Number.isFinite(video.duration) ? video.duration : target;
                                            const safeTarget = Math.max(0, Math.min(target, duration));
                                            try {
                                                video.currentTime = safeTarget;
                                                delete video.dataset.pendingSeek;
                                            } catch (_) {
                                                video.dataset.pendingSeek = String(safeTarget);
                                            }
                                        };
                                        if (video.readyState >= 1 && Number.isFinite(video.duration)) applyTarget();
                                        else {
                                            video.dataset.pendingSeek = String(target);
                                            if (video.dataset.seekListenerAttached !== '1') {
                                                video.dataset.seekListenerAttached = '1';
                                                const retry = () => {
                                                    const pending = Number(video.dataset.pendingSeek);
                                                    if (Number.isFinite(pending)) {
                                                        const duration = Number.isFinite(video.duration) ? video.duration : pending;
                                                        try { video.currentTime = Math.max(0, Math.min(pending, duration)); delete video.dataset.pendingSeek; } catch (_) {}
                                                    }
                                                    video.dataset.seekListenerAttached = '0';
                                                };
                                                video.addEventListener('loadedmetadata', retry, { once: true });
                                                video.addEventListener('canplay', retry, { once: true });
                                            }
                                        }
                                    }
                                    let latestProjectionTimestamp = 0;
                                    let latestProjectionData = null;
                                    // Un URL blob: solo existe en la página que seleccionó el archivo.
                                    // El archivo se recibe en esta ventana; la pantalla de proyección nunca pide al usuario elegirlo.
                                    let pendingRemoteBlobKey = '';
                                    let mappedRemoteBlobKey = '';
                                    let localProjectionVideoUrl = '';
                                    function applyProjection(data, force = false) {
                                        // Ignorar mensajes ajenos al estado de proyección. El iframe de YouTube
                                        // también emite mensajes window.postMessage; tratarlos como estado
                                        // visual reiniciaba el diseño y volvía a pantalla completa.
                                        if (!data || typeof data !== 'object' || !data.styles ||
                                            !Object.prototype.hasOwnProperty.call(data, 'mediaMode') ||
                                            !Number.isFinite(Number(data.timestamp)) || Number(data.timestamp) <= 0) return;
                                        if (projectorControllerId ? data.controllerId !== projectorControllerId : !!data.controllerId) return;
                                        const incomingTimestamp = Number(data.timestamp || 0);
                                        if (!force && incomingTimestamp && incomingTimestamp <= latestProjectionTimestamp) return;
                                        if (incomingTimestamp && (!force || incomingTimestamp > latestProjectionTimestamp)) latestProjectionTimestamp = incomingTimestamp;
                                        latestProjectionData = data;
                                        const styles = data.styles;
                                        const text = document.getElementById('proj-text');
                                        const citation = document.getElementById('proj-citation');
                                        const backdrop = document.getElementById('proj-backdrop');
                                        const overlay = document.getElementById('proj-overlay');
                                        const video = document.getElementById('proj-video');
                                        const youtube = document.getElementById('proj-youtube');
                                        const standby = document.getElementById('proj-logo-standby');
                                        const corner = document.getElementById('proj-logo-corner');
                                        const karaokeBox = document.getElementById('proj-karaoke'); const karaokeText = document.getElementById('proj-karaoke-stanza');
                                        const karaoke = data.karaoke || {}; const karaokeStyle = karaoke.style || {};
                                        const karaokeLoaded = !!karaoke.active && !!String(karaoke.stanza || '').trim();
                                        const youtubeLyricsLayout = data.mediaMode === 'youtube' && karaokeLoaded;
                                        // La API de YouTube reemplaza el nodo objetivo por un iframe. Por eso el tamaño
                                        // se aplica al contenedor estable, no al iframe que controla YouTube.
                                        const karaokeBg = document.getElementById('proj-karaoke-bg');
                                        if (youtubeLyricsLayout) {
                                            youtube.style.top='0'; youtube.style.left='0'; youtube.style.right='0'; youtube.style.bottom='auto';
                                            youtube.style.width='100%'; youtube.style.height='76%'; youtube.style.overflow='hidden';
                                            youtube.style.contain='layout paint'; youtube.style.clipPath='inset(0)';
                                            karaokeBox.style.inset='76% 0 0 0'; karaokeBox.style.padding='1% 5%';
                                            karaokeBox.style.zIndex='40';
                                            karaokeText.style.maxHeight='100%'; karaokeText.style.overflow='hidden';
                                            karaokeText.style.fontSize=Math.max(1.5,Math.min(Number(karaokeStyle.size)||4.5,12))+'vw';
                                        } else {
                                            youtube.style.top=''; youtube.style.left=''; youtube.style.right=''; youtube.style.bottom='';
                                            youtube.style.width=''; youtube.style.height=''; youtube.style.overflow='hidden';
                                            youtube.style.contain='layout paint'; youtube.style.clipPath='inset(0)';
                                            karaokeBox.style.inset=''; karaokeBox.style.padding=''; karaokeBox.style.zIndex='40';
                                            karaokeText.style.maxHeight=''; karaokeText.style.overflow='';
                                        }
                                        // Las letras se dibujan encima del video local como en la versión estable anterior.
                                        // El fondo del video se oculta por separado, sin ocultar la capa de karaoke.
                                        if (karaokeLoaded && !data.isClearText && !data.isStandby && data.mediaMode !== 'screen') {
                                            karaokeBox.classList.remove('hidden'); karaokeText.textContent=karaoke.stanza || '';
                                            karaokeText.style.fontFamily='\"'+(karaokeStyle.font||'Inter')+'\", sans-serif';
                                            if (!youtubeLyricsLayout) karaokeText.style.fontSize=(Number(karaokeStyle.size)||4.5)+'vw';
                                            karaokeText.style.color=karaokeStyle.color||'#fff'; karaokeText.style.textAlign=karaokeStyle.align||'center';
                                            karaokeText.style.fontWeight='700';
                                            karaokeText.style.textShadow=karaokeStyle.shadow===false?'none':'0 2px 12px rgba(0,0,0,.95), 0 4px 24px rgba(0,0,0,.75)';
                                            karaokeText.style.whiteSpace='pre-line';
                                            if (karaokeBg) {
                                                karaokeBg.style.opacity=String(Math.max(0,Math.min(100,Number(karaokeStyle.bgOpacity===undefined?100:karaokeStyle.bgOpacity))/100));
                                                if (karaokeStyle.transparent) { karaokeBg.style.background='transparent'; karaokeBg.style.backgroundImage='none'; }
                                                else if (karaokeStyle.bgType==='image' && karaokeStyle.bgImage) { karaokeBg.style.background='none'; karaokeBg.style.backgroundImage='url(\"'+String(karaokeStyle.bgImage).replace(/\"/g,'%22')+'\")'; karaokeBg.style.backgroundSize='cover'; karaokeBg.style.backgroundPosition='center'; }
                                                else if (karaokeStyle.bgType==='gradient') { karaokeBg.style.background=karaokeStyle.bgGradient||'linear-gradient(135deg,#020617,#1e1b4b)'; }
                                                else { karaokeBg.style.background=karaokeStyle.bgColor||'#000000'; karaokeBg.style.backgroundImage='none'; }
                                            }

                                                } else {
                                                    projectorReceiveChannel = incomingChannel;
                                                    projectorReceiveChannel.binaryType = 'arraybuffer';
                                                    projectorReceiveChannel.onmessage = handleReceivedVideoMessage;
                                                    projectorReceiveChannel.onerror = error => console.error('Canal de video:', error);
                                                }
                                            };
                                            await pc.setRemoteDescription({ type: 'offer', sdp: offer.sdp });
                                            const answer = await pc.createAnswer();
                                            await pc.setLocalDescription(answer);
                                            await waitForIceGathering(pc);
                                            const answerPayload = { sessionId: offer.sessionId, type: 'answer', sdp: pc.localDescription.sdp, timestamp: Date.now(), projectorId: projectorInstanceId };
                                            channel.postMessage({ type: '__video_transfer_answer', ...answerPayload });
                                        } catch (error) { console.error('No se pudo aceptar la conexión de video:', error); }
                                    }

                                    let projectorScreenPeer = null;
                                    let projectorScreenSessionId = '';
                                    let projectorScreenRemoteDescriptionApplied = false;
                                    let projectorScreenPendingOfferCandidates = [];
                                    const projectorPendingScreenCandidates = new Map();
                                    function closeProjectorScreenPeer() {
                                        if (projectorScreenSessionId) projectorPendingScreenCandidates.delete(projectorScreenSessionId);
                                        try { if (projectorScreenPeer) projectorScreenPeer.close(); } catch (_) {}
                                        projectorScreenPeer = null;
                                        projectorScreenSessionId = '';
                                        projectorScreenRemoteDescriptionApplied = false;
                                        projectorScreenPendingOfferCandidates = [];
                                        const screenVideo = document.getElementById('proj-screen-video');
                                        if (screenVideo) {
                                            try { if (screenVideo.srcObject) screenVideo.srcObject.getTracks().forEach(track => track.stop()); } catch (_) {}
                                            screenVideo.pause(); screenVideo.srcObject = null; screenVideo.classList.add('hidden');
                                        }
                                    }
                                    function receiveProjectorScreenCandidate(message) {
                                        if (!message || message.projectorId !== projectorInstanceId || message.direction !== 'offer' || !message.sessionId || !message.candidate) return;
                                        if (!projectorScreenPeer || message.sessionId !== projectorScreenSessionId) {
                                            const pending = projectorPendingScreenCandidates.get(message.sessionId) || [];
                                            if (pending.length < 32) pending.push(message.candidate);
                                            projectorPendingScreenCandidates.set(message.sessionId, pending);
                                            while (projectorPendingScreenCandidates.size > 5) projectorPendingScreenCandidates.delete(projectorPendingScreenCandidates.keys().next().value);
                                            return;
                                        }
                                        const candidate = new RTCIceCandidate(message.candidate);
                                        if (!projectorScreenRemoteDescriptionApplied) projectorScreenPendingOfferCandidates.push(candidate);
                                        else projectorScreenPeer.addIceCandidate(candidate).catch(error => console.warn('No se pudo añadir un candidato ICE de la consola:', error));
                                    }
                                    async function handleScreenOffer(offer) {
                                        if (!offer || !offer.sessionId || !offer.sdp || offer.projectorId !== projectorInstanceId) return;
                                        if (offer.sessionId === projectorScreenSessionId) return;
                                        const earlyCandidates = projectorPendingScreenCandidates.get(offer.sessionId) || [];
                                        projectorPendingScreenCandidates.delete(offer.sessionId);
                                        closeProjectorScreenPeer();
                                        projectorScreenSessionId = offer.sessionId;
                                        projectorScreenPendingOfferCandidates = earlyCandidates.map(candidate => new RTCIceCandidate(candidate));
                                        try {
                                            const pc = new RTCPeerConnection({ iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] });
                                            projectorScreenPeer = pc;
                                            pc.onicecandidate = event => {
                                                if (!event.candidate || projectorScreenSessionId !== offer.sessionId || projectorScreenPeer !== pc) return;
                                                const candidate = typeof event.candidate.toJSON === 'function' ? event.candidate.toJSON() : event.candidate;
                                                channel.postMessage({ type: '__screen_capture_candidate', direction: 'answer', sessionId: offer.sessionId, projectorId: projectorInstanceId, candidate, timestamp: Date.now() });
                                            };
                                            pc.ontrack = event => {
                                                const screenVideo = document.getElementById('proj-screen-video');
                                                if (!screenVideo) return;
                                                screenVideo.srcObject = event.streams && event.streams[0] ? event.streams[0] : new MediaStream([event.track]);
                                                const isLiveProjection = !!(latestProjectionData && latestProjectionData.mediaMode === 'screen');
                                                screenVideo.muted = !isLiveProjection;
                                                screenVideo.volume = 1;
                                                if (isLiveProjection) screenVideo.classList.remove('hidden');
                                                else screenVideo.classList.add('hidden');
                                                if (isLiveProjection) screenVideo.play().then(() => {
                                                    const prompt = document.getElementById('proj-enable-audio');
                                                    if (prompt) prompt.classList.add('hidden');
                                                }).catch(error => {
                                                    console.warn('La reproducción de captura necesita activación en la ventana del proyector:', error);
                                                    const prompt = document.getElementById('proj-enable-audio');
                                                    if (prompt) { prompt.textContent = '▶ Toca para activar el audio de la captura'; prompt.classList.remove('hidden'); }
                                                });
                                            };
                                            pc.onconnectionstatechange = () => {
                                                if (['failed', 'closed'].includes(pc.connectionState)) {
                                                    const screenVideo = document.getElementById('proj-screen-video');
                                                    if (screenVideo) screenVideo.classList.add('hidden');
                                                }
                                            };
                                            await pc.setRemoteDescription({ type: 'offer', sdp: offer.sdp });
                                            projectorScreenRemoteDescriptionApplied = true;
                                            for (const candidate of projectorScreenPendingOfferCandidates.splice(0)) await pc.addIceCandidate(candidate);
                                            const answer = await pc.createAnswer();
                                            await pc.setLocalDescription(answer);
                                            const screenAnswer = { sessionId: offer.sessionId, type: 'answer', sdp: pc.localDescription.sdp, timestamp: Date.now(), projectorId: projectorInstanceId };
                                            channel.postMessage({ type: '__screen_capture_answer', ...screenAnswer });
                                        } catch (error) { console.error('No se pudo recibir el vídeo de pantalla por WebRTC:', error); closeProjectorScreenPeer(); }
                                    }

                                    const projectedVideoElement = document.getElementById('proj-video');
                                    if (projectedVideoElement) {
                                        ['loadedmetadata', 'loadeddata', 'durationchange', 'play', 'playing', 'pause', 'seeked', 'ended', 'timeupdate', 'waiting', 'resize', 'error'].forEach(eventName => {
                                            projectedVideoElement.addEventListener(eventName, () => sendProjectorVideoStatus(eventName !== 'timeupdate'));
                                        });
                                    }
                                    startProjectorMirror();

                                    // Safari puede bloquear audio iniciado desde otra ventana. Si sucede,
                                    // permite activar el video con un gesto dentro de esta ventana.
                                    const audioPrompt = document.getElementById('proj-enable-audio');
                                    if (audioPrompt) audioPrompt.addEventListener('click', () => {
                                        const screenVideo = document.getElementById('proj-screen-video');
                                        const video = screenVideo && !screenVideo.classList.contains('hidden') ? screenVideo : document.getElementById('proj-video');
                                        if (!video) return;
                                        video.muted = false; video.volume = 1;
                                        video.play().then(() => audioPrompt.classList.add('hidden')).catch(() => { audioPrompt.textContent = 'No se pudo iniciar el audio'; });
                                    });

                                    // Recupera el último estado al abrir o recargar la ventana de proyección.
                                    try {
                                        const saved = localStorage.getItem(STORAGE_KEY);
                                        if (saved) applyProjection(JSON.parse(saved));
                                    } catch (error) { console.warn('No se pudo recuperar el estado guardado', error); }
                                })();
                            </script>
                        </body>
                        </html>
